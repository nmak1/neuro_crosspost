name: Deploy Neuro Crosspost (Python bot)

# Деплой Python-бота neuro_crosspost на сервер (~/neuro_crosspost, сервис neuro_crosspost).
# НЕ использует Node.js/npm — это чистый git fetch + git reset --hard + pip + systemctl restart.
# ВАЖНО: используется принудительная синхронизация с origin/main (reset --hard),
# а НЕ git pull. Локальные правки на сервере раньше ломали деплой:
#   "error: Your local changes to the following files would be overwritten by merge"
# Перед сбросом все локальные изменения сохраняются в git stash и в резервную копию .bak,
# так что их всегда можно вернуть вручную по SSH.

on:
  push:
    branches:
      - main
  workflow_dispatch: # позволяет запустить деплой вручную из вкладки Actions

permissions:
  contents: read

concurrency:
  group: deploy-neuro_crosspost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::Секрет DEPLOY_SSH_KEY пуст или отсутствует — деплой невозможен."
            echo "Добавьте его: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          # Кладём ключ в $RUNNER_TEMP, а НЕ в ~/.ssh и не в рабочую директорию:
          #   - HOME в Actions иногда указывает на недоступный для записи путь;
          #   - после actions/checkout рабочая директория джоба может принадлежать
          #     root — mkdir в ней падал с "mkdir: Permission denied".
          # $RUNNER_TEMP всегда принадлежит пользователю runner'а и доступен на запись.
          KEYDIR="${RUNNER_TEMP:-$(mktemp -d)}/deploy-ssh"
          mkdir -p "$KEYDIR"
          chmod 700 "$KEYDIR"
          # printf сохраняет переводы строк как есть (echo мог их испортить)
          printf '%s\n' "$KEY" > "$KEYDIR/deploy_key"
          chmod 600 "$KEYDIR/deploy_key"
          # пробрасываем путь дальше — один и тот же каталог во всех шагах джоба
          echo "KEYDIR=$KEYDIR" >> "$GITHUB_ENV"

          echo "::group::Key diagnostics"
          head -n 1 "$KEYDIR/deploy_key"
          wc -l < "$KEYDIR/deploy_key" | xargs echo "Lines in key file:"
          if command -v openssl >/dev/null 2>&1; then
            openssl pkey -in "$KEYDIR/deploy_key" -noout \
              && echo "openssl: key loads OK" \
              || echo "openssl: FAILED to load key -> secret is corrupt or wrong key type"
          fi
          echo "::endgroup::"

          # Добавляем сервер в известные хосты, чтобы SSH не спрашивал подтверждение
          ssh-keyscan -H 80.78.248.91 >> "$KEYDIR/known_hosts"

      - name: Deploy to server
        env:
          SERVER: ${{ secrets.DEPLOY_SERVER }}
        run: |
          set -euo pipefail
          SERVER="${SERVER:-nmak1@80.78.248.91}"
          ssh -v -i "$KEYDIR/deploy_key" -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$KEYDIR/known_hosts" "$SERVER" '
              set -e
              cd ~/neuro_crosspost

              # 1) Принудительно синхронизируем репозиторий с origin/main.
              #    git pull здесь падал, если на сервере были локальные правки
              #    ("local changes would be overwritten by merge") — поэтому
              #    сначала сохраняем их в stash + резервную копию, затем reset --hard.
              if ! git diff --quiet || ! git diff --cached --quiet; then
                echo "На сервере есть незакоммиченные изменения — сохраняем их..." >&2
                TS=$(date +%Y%m%d_%H%M%S)
                git stash push --include-untracked -m "auto-stash before deploy $TS" || true
                tar --exclude=.git --exclude=venv --exclude=data \
                    -czf "../neuro_crosspost_local_backup_${TS}.tar.gz" . 2>/dev/null || true
                echo "Резервная копия: ~/neuro_crosspost_local_backup_${TS}.tar.gz" >&2
              fi
              git fetch origin main
              git reset --hard origin/main
              # убираем лишние неотслеживаемые файлы (кроме venv и data — они нужны)
              git clean -fd -e venv -e data || true

              # 2) Зависимости
              source venv/bin/activate
              pip install -r requirements.txt

              # 3) Перезапуск сервиса
              sudo systemctl restart neuro_crosspost
              sleep 2
              systemctl is-active neuro_crosspost
            '