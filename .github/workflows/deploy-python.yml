name: Deploy Neuro Crosspost (Python bot)

# Деплой Python-бота neuro-crosspost на сервер (~/neuro-crosspost, сервис neuro-crosspost).
# НЕ использует Node.js/npm — это чистый git pull + pip + systemctl restart.

on:
  push:
    branches:
      - main
  workflow_dispatch: # позволяет запустить деплой вручную из вкладки Actions

permissions:
  contents: read

concurrency:
  group: deploy-neuro-crosspost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # printf сохраняет переводы строк как есть (echo мог их испортить)
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "::group::Key diagnostics"
          head -n 1 ~/.ssh/deploy_key
          wc -l < ~/.ssh/deploy_key | xargs echo "Lines in key file:"
          if command -v openssl >/dev/null 2>&1; then
            openssl pkey -in ~/.ssh/deploy_key -noout \
              && echo "openssl: key loads OK" \
              || echo "openssl: FAILED to load key -> secret is corrupt or wrong key type"
          fi
          echo "::endgroup::"

          # Добавляем сервер в известные хосты, чтобы SSH не спрашивал подтверждение
          ssh-keyscan -H 80.78.248.91 >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER: ${{ secrets.DEPLOY_SERVER }}
        run: |
          set -euo pipefail
          SERVER="${SERVER:-nmak1@80.78.248.91}"
          ssh -v -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SERVER" '
            cd ~/neuro-crosspost &&
            git pull origin main &&
            source venv/bin/activate &&
            pip install -r requirements.txt &&
            sudo systemctl restart neuro-crosspost
          '
