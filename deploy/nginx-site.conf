# ВНИМАНИЕ: на сервере уже работает другое приложение (порт 80, "My Cloud").
# Поэтому фронтенд AutoPoster отдаётся на порту 8080.
# Если захотите перенести его на порт 80 — замените listen и удалите старый сайт nginx.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /opt/autoposter/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
